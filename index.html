<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>さと・太鼓打数カウンター</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1324;color:#f2f6ff;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:20px}h1{font-size:clamp(22px,4vw,34px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#1b2944;border-radius:16px;padding:16px 8px;text-align:center}.stat label{display:block;color:#bdcbe5;font-size:clamp(12px,2vw,16px)}.stat b{font-size:clamp(24px,6vw,49px);font-variant-numeric:tabular-nums}.pad{width:100%;height:38vh;min-height:250px;background:#2851bf;color:white;border:2px solid #87a4ff;border-radius:25px;cursor:pointer;touch-action:manipulation;user-select:none}.pad:active{background:#3b68e4}.pad strong{display:block;font-size:clamp(80px,17vw,155px);line-height:1.2}.pad span{font-size:20px}.bar{background:#2a3954;height:24px;border-radius:16px;overflow:hidden;margin:10px 0 20px}.fill{height:100%;width:0;background:linear-gradient(90deg,#4db7ff,#a58cff)}.progress{display:flex;justify-content:space-between;margin-top:20px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls button{padding:16px 4px;border:0;border-radius:12px;color:white;background:#465a80;font-size:clamp(13px,2.6vw,19px);font-weight:700;cursor:pointer}.controls button:disabled{opacity:.45}.controls #start{background:#177a59}.controls #stop{background:#ae6339}.controls #reset{background:#505a74}.help{color:#b6c4dd;font-size:14px;line-height:1.8}#status{color:#b6c4dd}</style></head><body><main><h1>🥁 さと・太鼓打数カウンター</h1><p id="status">待機中</p><div class="stats"><div class="stat"><label>経過時間</label><b id="time">0.00</b><label>秒</label></div><div class="stat"><label>平均密度</label><b id="rate">0.00</b><label>打/秒</label></div><div class="stat"><label>100打達成</label><b id="hundreds">0</b><label>回</label></div></div><button class="pad" id="pad" aria-label="1打追加"><span>タップ / クリックで +1</span><strong id="count">0</strong><span>打（コンボ）</span></button><div class="progress"><b>次の100打まで</b><span id="progressText">0 / 100</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><div class="controls"><button id="start">▶ 曲開始</button><button id="stop" disabled>■ 曲終了</button><button id="reset">↺ リセット</button></div><p class="help">スペースキーでも1打加算。曲開始で打数と時間を0に戻して計測開始。曲終了で計測停止。リセットで初期化します。</p></main><script>(()=>{const el=id=>document.getElementById(id);let count=0,elapsed=0,origin=0,mode='idle',frame=0;const seconds=()=>mode==='running'?elapsed+(performance.now()-origin)/1000:elapsed;function draw(){let s=seconds(),p=count%100;el('count').textContent=count.toLocaleString();el('time').textContent=s.toFixed(2);el('rate').textContent=(s?count/s:0).toFixed(2);el('hundreds').textContent=Math.floor(count/100);el('progressText').textContent=p+' / 100';el('fill').style.width=p+'%';el('bar').setAttribute('aria-valuenow',p);el('status').textContent=mode==='running'?'● 計測中':mode==='stopped'?'■ 曲終了':'待機中';el('start').disabled=mode==='running';el('stop').disabled=mode!=='running'}function tick(){draw();if(mode==='running')frame=requestAnimationFrame(tick)}function hit(){count++;draw()}el('pad').addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button===0)hit()});el('pad').addEventListener('click',e=>{if(e.detail===0)hit()});document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;e.preventDefault();hit()});el('start').onclick=()=>{count=0;elapsed=0;origin=performance.now();mode='running';cancelAnimationFrame(frame);tick()};el('stop').onclick=()=>{elapsed=seconds();mode='stopped';cancelAnimationFrame(frame);draw()};el('reset').onclick=()=>{count=0;elapsed=0;mode='idle';cancelAnimationFrame(frame);draw()};draw()})();</script></body></html>
